services:
  # ── Backend (Socket.IO server) ────────────────────────────────────────────────
  - type: web
    name: kramkard-server
    runtime: node
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: TURSO_DATABASE_URL
        sync: false   # You'll paste this in the Render dashboard
      - key: TURSO_AUTH_TOKEN
        sync: false   # You'll paste this in the Render dashboard
      - key: CLIENT_ORIGIN
        sync: false   # Set to your Render static site URL after deploy, e.g. https://kramkard.onrender.com

  # ── Frontend (Vite/React static site) ────────────────────────────────────────
  - type: static
    name: kramkard-client
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_SERVER_URL
        sync: false   # Set to your server URL, e.g. https://kramkard-server.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html